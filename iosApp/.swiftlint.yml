# SwiftLint configuration for tembt iOS
# Aligned with the KMP code-style standard (kmp-code-style skill): line length 120,
# no force-unwrapping, no print() in production, no AnyView.

included:
  - iosApp

excluded:
  - iosApp/Assets.xcassets

# NOTE: pre-existing violations are grandfathered via swiftlint-baseline.json, passed
# with `--baseline` on the command line (see Makefile, .githooks/pre-commit, CI). Burn
# it down over time; regenerate with: swiftlint lint --write-baseline swiftlint-baseline.json

# ---------------------------------------------------------------------------
# Opt-in rules
# ---------------------------------------------------------------------------
opt_in_rules:
  - force_unwrapping          # KMP standard: never force-unwrap
  - sorted_imports
  - closure_spacing
  - operator_usage_whitespace
  - trailing_closure
  - vertical_whitespace_closing_braces
  - vertical_whitespace_opening_braces
  - toggle_bool
  - first_where
  - last_where
  - sorted_first_last
  - explicit_init
  - redundant_nil_coalescing
  - prefer_self_type_over_type_of_self
  - empty_count
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_range_nil_comparison
  - flatmap_over_map_reduce
  - prefer_zero_over_explicit_init

# ---------------------------------------------------------------------------
# Analyzer rules (run only with `swiftlint analyze`)
# ---------------------------------------------------------------------------
analyzer_rules:
  - unused_import

# ---------------------------------------------------------------------------
# Disabled rules
# ---------------------------------------------------------------------------
disabled_rules:
  - trailing_comma           # project does not use trailing commas — consistent as-is
  - computed_accessors_order # SwiftUI body properties exceed this regularly

# ---------------------------------------------------------------------------
# Rule configuration
# ---------------------------------------------------------------------------

# KMP standard: max line length 120
line_length:
  warning: 120
  error: 140
  ignores_comments: true
  ignores_urls: true

function_body_length:
  warning: 50
  error: 80

type_body_length:
  warning: 300
  error: 450

file_length:
  warning: 400
  error: 500
  ignore_comment_only_lines: true

identifier_name:
  min_length:
    warning: 2
  max_length:
    warning: 50
    error: 60
  excluded:
    - id
    - x
    - y
    - i
    - r
    - g
    - b

nesting:
  type_level:
    warning: 2
  function_level:
    warning: 5

trailing_closure:
  only_single_muted_parameter: true

vertical_whitespace:
  max_empty_lines: 1

# ---------------------------------------------------------------------------
# Custom rules
# ---------------------------------------------------------------------------
custom_rules:

  mark_spacing:
    name: "MARK Spacing"
    regex: '\/\/MARK:'
    message: "Use '// MARK:' with a space after '//' (found '//MARK:')."
    severity: warning

  no_print_in_production:
    name: "No print() in Production Code"
    regex: '(?<!\/\/ )\bprint\('
    message: "Avoid bare print() in production code. Use a Logger abstraction guarded by #if DEBUG."
    severity: warning

  no_any_view:
    name: "No AnyView"
    regex: '\bAnyView\b'
    message: "Avoid AnyView — it disables type-based diffing. Use @ViewBuilder or generics instead."
    severity: warning
